name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libleptonica-dev \
            libtesseract-dev tesseract-ocr poppler-utils djvulibre-bin
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo fmt --all --check

  package:
    name: Source package and installed binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/verify-package.sh

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y plantuml
      - run: docs/diagrams/render.sh --check
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md 'docs/**/*.md'
          fail: true
