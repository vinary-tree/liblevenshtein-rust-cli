name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libleptonica-dev \
            libtesseract-dev tesseract-ocr poppler-utils djvulibre-bin
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo fmt --all --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked --allow-dirty
