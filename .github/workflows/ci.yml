name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libleptonica-dev \
            libtesseract-dev tesseract-ocr poppler-utils djvulibre-bin
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo fmt --all --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - name: Check publishable package
        shell: bash
        run: |
          version="$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if cargo info "liblevenshtein@$version" >/dev/null 2>&1; then
            cargo package --locked --allow-dirty
          else
            echo "Deferred until liblevenshtein $version is published (required release order)."
          fi
