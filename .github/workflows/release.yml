name: Release CLI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin-siblings-cratesio
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive executable
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/liblevenshtein dist/
          cp README.md LICENSE dist/
          tar -czf liblevenshtein-${{ matrix.target }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: liblevenshtein-${{ matrix.target }}
          path: liblevenshtein-${{ matrix.target }}.tar.gz

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin-siblings-cratesio
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Debian package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - name: RPM package
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
      - name: Arch Linux package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd
          root=target/arch-package
          mkdir -p "$root/usr/bin" "$root/usr/share/doc/liblevenshtein"
          install -m755 target/release/liblevenshtein "$root/usr/bin/liblevenshtein"
          install -m644 README.md LICENSE "$root/usr/share/doc/liblevenshtein/"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          {
            echo "pkgname = liblevenshtein"
            echo "pkgbase = liblevenshtein"
            echo "pkgver = $version-1"
            echo "pkgdesc = Fuzzy matching, dictionary, REPL, and document grep utility"
            echo "url = https://github.com/vinary-tree/liblevenshtein-rust-cli"
            echo "builddate = $(date +%s)"
            echo "packager = GitHub Actions"
            echo "size = $(du -sb "$root/usr" | cut -f1)"
            echo "arch = x86_64"
            echo "license = Apache-2.0"
          } > "$root/.PKGINFO"
          bsdtar --zstd -cf "target/liblevenshtein-$version-1-x86_64.pkg.tar.zst" -C "$root" .
      - uses: actions/upload-artifact@v4
        with:
          name: liblevenshtein-linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/*.pkg.tar.zst

  publish:
    needs: [binaries, linux-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin-siblings-cratesio
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [binaries, linux-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
          generate_release_notes: true
