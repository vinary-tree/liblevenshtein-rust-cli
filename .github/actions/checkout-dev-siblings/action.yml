name: Checkout development sibling crates
description: >
  Clone liblevenshtein and its dictionary dependencies beside this checkout so
  the development-only path dependencies resolve.

inputs:
  ref:
    description: Git ref (branch, tag, or SHA) to check out for the sibling crates.
    required: false
    default: master

runs:
  using: composite
  steps:
    - name: Clone sibling crates into the workspace parent
      shell: bash
      run: |
        set -euo pipefail
        parent="$(dirname "$GITHUB_WORKSPACE")"
        for repo in llattice libdictenstein; do
          dest="$parent/$repo"
          if [ -d "$dest/.git" ]; then
            echo "::group::Updating $repo to ${{ inputs.ref }}"
            git -C "$dest" fetch --depth 1 origin "${{ inputs.ref }}"
            git -C "$dest" checkout -f FETCH_HEAD
            echo "::endgroup::"
          else
            echo "::group::Cloning $repo @ ${{ inputs.ref }}"
            git clone --depth 1 --branch "${{ inputs.ref }}" \
              "https://github.com/vinary-tree/$repo.git" "$dest"
            echo "::endgroup::"
          fi
        done
        git clone --depth 1 --branch "${{ inputs.ref }}" \
          "https://github.com/universal-automata/liblevenshtein-rust.git" \
          "$parent/liblevenshtein-rust"
        echo "Sibling crates available under $parent:"
        ls -1d "$parent"/llattice "$parent"/libdictenstein "$parent"/liblevenshtein-rust
