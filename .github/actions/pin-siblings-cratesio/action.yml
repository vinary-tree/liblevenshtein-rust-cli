name: Pin sibling crates to crates.io
description: >
  Drop development-only local `path` overrides so production builds resolve
  liblevenshtein and libdictenstein from crates.io.

runs:
  using: composite
  steps:
    - name: Strip development path overrides
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import pathlib
        import re

        manifest = pathlib.Path("Cargo.toml")
        before = manifest.read_text()
        after = before
        for crate, directory in (
            ("liblevenshtein", "liblevenshtein-rust"),
            ("libdictenstein", "libdictenstein"),
        ):
            after = re.sub(
                rf'{crate} = \{{ path = "\.\./{directory}", (version = "[^"]+")',
                rf'{crate} = {{ \1',
                after,
            )
        if after == before:
            raise SystemExit(
                "ERROR: expected development `path` overrides, but none changed. "
                "The manifest form changed — "
                "update .github/actions/pin-siblings-cratesio/action.yml."
            )
        manifest.write_text(after)
        PY
        cargo generate-lockfile
        grep -nE '^(liblevenshtein|libdictenstein) =' Cargo.toml
