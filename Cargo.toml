[workspace]
members = ["."]
resolver = "2"

[package]
name = "liblevenshtein-cli"
version = "0.10.0"
edition = "2021"
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/universal-automata/liblevenshtein-rust-cli"
description = "Command-line, REPL, archive, and document-search tools for liblevenshtein"
keywords = ["levenshtein", "fuzzy-search", "grep", "cli", "automata"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[lib]
name = "liblevenshtein_cli"
path = "src/lib.rs"
doc = false
doctest = false

[[bin]]
name = "liblevenshtein"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
liblevenshtein = { path = "../liblevenshtein-rust", version = "0.10" }
libdictenstein = { path = "../libdictenstein", version = "0.2", default-features = false }

anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "3.0"
dirs = "6.0"
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

flate2 = { version = "1.0", optional = true }
rayon = { version = "1.11", optional = true }
zstd = { version = "0.13", optional = true }
xz2 = { version = "0.1", optional = true }
bzip2 = { version = "0.6", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "8.0", optional = true }
globset = { version = "0.4", optional = true }
pdf-extract = { version = "0.12", optional = true }
gag = { version = "1.0", optional = true }
calamine = { version = "0.36", optional = true }
docx-rs = { version = "0.4", optional = true }
quick-xml = { version = "0.41", optional = true }
leptess = { version = "0.14", optional = true }
tempfile = { version = "3.8", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["cli", "compression", "protobuf", "grep-full"]

# The executable surface always uses the phonetic matcher, dictionary persistence,
# and PathMap backend, but these named features preserve familiar source-build knobs.
cli = ["serialization", "pathmap-backend", "phonetic-rules"]
pathmap-backend = [
    "liblevenshtein/pathmap-backend",
    "libdictenstein/pathmap-backend",
]
serialization = [
    "liblevenshtein/serialization",
    "libdictenstein/serialization",
]
compression = [
    "serialization",
    "liblevenshtein/compression",
    "libdictenstein/compression",
    "dep:flate2",
]
protobuf = [
    "serialization",
    "liblevenshtein/protobuf",
    "libdictenstein/protobuf",
]
phonetic-rules = ["liblevenshtein/phonetic-rules"]
parallel-grep = ["phonetic-rules", "liblevenshtein/parallel-grep", "dep:rayon"]

grep-compression = ["dep:flate2", "dep:zstd", "dep:xz2", "dep:bzip2"]
grep-archives = ["dep:tar", "dep:zip", "dep:globset", "grep-compression"]
grep-pdf = ["dep:pdf-extract", "dep:gag"]
grep-pdf-ocr = ["grep-pdf", "dep:leptess", "dep:tempfile"]
grep-docx = ["dep:docx-rs"]
grep-xlsx = ["dep:calamine"]
grep-epub = ["dep:quick-xml", "dep:zip"]
grep-odt = ["dep:quick-xml", "dep:zip"]
grep-documents = ["grep-pdf", "grep-docx", "grep-xlsx", "grep-epub", "grep-odt"]
grep-full = [
    "parallel-grep",
    "grep-compression",
    "grep-archives",
    "grep-documents",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[package.metadata.deb]
name = "liblevenshtein"
maintainer = "Dylon Edwards <dylon.devo@gmail.com>"
section = "utils"
assets = [
    ["target/release/liblevenshtein", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/liblevenshtein/README.md", "644"],
    ["LICENSE", "usr/share/doc/liblevenshtein/LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "liblevenshtein"
assets = [
    { source = "target/release/liblevenshtein", dest = "/usr/bin/liblevenshtein", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/liblevenshtein/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/liblevenshtein/LICENSE", mode = "644", doc = true },
]
